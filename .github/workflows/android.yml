name: Build Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish each build as a GitHub release.
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      # Repo variable (Settings → Secrets and variables → Actions → Variables).
      # Unset = leads stay on the phone (test mode). See server/README.md.
      LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose their executable bit.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests (eligibility engine, app, server)
        run: ./gradlew :core:test testDebugUnitTest :server:test

      - name: Build test APK
        run: ./gradlew assembleDebug -PleadEndpoint="$LEAD_ENDPOINT"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-install-on-your-phone
          path: app/build/outputs/apk/debug/*.apk

      # Posts the APK as a release so a phone can download it with one tap.
      # Always-current link: /releases/latest/download/business-loan-finder.apk
      - name: Publish test APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk business-loan-finder.apk
          gh release create "build-${{ github.run_number }}" business-loan-finder.apk \
            --title "Test build ${{ github.run_number }}" \
            --notes "Test version for installing on your own phone. Uses sample lenders. Not the Play Store version." \
            --target "${{ github.sha }}" \
            --latest

      # Runs only after you add the four RELEASE_* secrets (see README).
      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed Play Store bundle
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }} -PleadEndpoint="$LEAD_ENDPOINT"

      - name: Upload Play Store bundle
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: play-store-bundle
          path: app/build/outputs/bundle/release/*.aab

  # The lead server's container image, built (not published) to catch Dockerfile breakage.
  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t loan-finder-server .
